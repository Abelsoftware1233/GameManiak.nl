<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestelling bevestigd — RetroVault</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-active="">

<header class="site-header" id="site-header"></header>

<section class="section container" id="confirm-section">
  <!-- injected by JS -->
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="products.js"></script>
<script src="shop.js"></script>
<script src="layout.js"></script>
<script>
  function renderNoOrder(){
    document.getElementById("confirm-section").innerHTML = `
      <div class="empty-state">
        <div class="glyph">📦</div>
        <h3>Geen recente bestelling gevonden</h3>
        <p>Er is geen bestelling om te tonen in deze sessie.</p>
        <a href="producten.html" class="btn btn-primary">Naar de webshop</a>
      </div>
    `;
  }

  function paymentLabel(method){
    if(method === "ideal") return "iDEAL";
    if(method === "card") return "Creditcard";
    if(method === "paypal") return "PayPal";
    return method;
  }

  function renderConfirmation(order){
    const itemRows = order.items.map(item => `
      <div class="mini-item">
        <div>
          <div class="name">${item.name}</div>
          <div class="qty">${item.qty} × ${formatPrice(item.price)}</div>
        </div>
        <div class="mono">${formatPrice(item.price * item.qty)}</div>
      </div>
    `).join("");

    const orderDate = new Date(order.date).toLocaleDateString("nl-NL", {
      day: "numeric", month: "long", year: "numeric"
    });

    document.getElementById("confirm-section").innerHTML = `
      <div class="steps" style="justify-content:center;">
        <div class="step done"><span class="n">✓</span> Winkelwagen</div>
        <div class="step done"><span class="n">✓</span> Gegevens &amp; betaling</div>
        <div class="step current"><span class="n">3</span> Bevestiging</div>
      </div>

      <div class="confirm-wrap">
        <div class="confirm-icon">✓</div>
        <h1>Bedankt voor je bestelling!</h1>
        <p>We hebben je bestelling ontvangen en sturen je een bevestiging naar <strong style="color:var(--paper);">${order.customer.email}</strong>.</p>
        <div class="order-num">Bestelnummer: ${order.orderNumber}</div>

        <div class="confirm-details">
          <h3 style="margin-bottom:14px;">Besteloverzicht &mdash; ${orderDate}</h3>
          ${itemRows}
          <div class="summary-row" style="margin-top:10px;">
            <span>Subtotaal</span>
            <span class="price">${formatPrice(order.totals.subtotal)}</span>
          </div>
          ${order.totals.promo ? `
          <div class="summary-row" style="color:var(--phosphor);">
            <span>Korting (${order.totals.promo.code})</span>
            <span>&minus; ${formatPrice(order.totals.discount)}</span>
          </div>` : ""}
          <div class="summary-row">
            <span>Verzending</span>
            <span>${order.totals.shipping === 0 ? "Gratis" : formatPrice(order.totals.shipping)}</span>
          </div>
          <div class="summary-row total">
            <span>Totaal betaald</span>
            <span class="price">${formatPrice(order.totals.total)}</span>
          </div>

          <div style="margin-top:22px; padding-top:18px; border-top:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:20px; font-size:12.5px;">
            <div>
              <div class="eyebrow" style="margin-bottom:6px;">Verzendadres</div>
              <div style="color:var(--paper);">
                ${order.customer.firstName} ${order.customer.lastName}<br>
                ${order.customer.address}<br>
                ${order.customer.postcode} ${order.customer.city}<br>
                ${order.customer.country}
              </div>
            </div>
            <div>
              <div class="eyebrow" style="margin-bottom:6px;">Betaalmethode</div>
              <div style="color:var(--paper);">${paymentLabel(order.paymentMethod)}</div>
              <div class="eyebrow" style="margin:12px 0 6px;">Status</div>
              <div style="color:var(--phosphor);">✓ Betaald (demo)</div>
            </div>
          </div>
        </div>

        <div style="margin-top:30px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
          <a href="producten.html" class="btn btn-primary">Verder winkelen</a>
          <a href="index.html" class="btn btn-outline">Terug naar home</a>
        </div>
      </div>
    `;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const raw = sessionStorage.getItem("retrovault_last_order");
    if(!raw){
      renderNoOrder();
      return;
    }
    try{
      const order = JSON.parse(raw);
      renderConfirmation(order);
    }catch(e){
      renderNoOrder();
    }
  });
</script>
</body>
</html>
