<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrekenen — RetroVault</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-active="checkout">

<header class="site-header" id="site-header"></header>

<section class="section container" id="checkout-section">
  <!-- injected by JS -->
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="products.js"></script>
<script src="shop.js"></script>
<script src="layout.js"></script>
<script>
  function renderEmptyCheckout(){
    document.getElementById("checkout-section").innerHTML = `
      <div class="empty-state">
        <div class="glyph">🛒</div>
        <h3>Je winkelwagen is leeg</h3>
        <p>Voeg eerst producten toe voordat je kunt afrekenen.</p>
        <a href="producten.html" class="btn btn-primary">Bekijk producten</a>
      </div>
    `;
  }

  function renderCheckout(){
    const items = getCartItems();
    if(items.length === 0){
      renderEmptyCheckout();
      return;
    }

    const totals = computeTotals();

    const miniItems = items.map(({product, qty}) => `
      <div class="mini-item">
        <div>
          <div class="name">${product.name}</div>
          <div class="qty">${qty} × ${formatPrice(product.price)}</div>
        </div>
        <div class="mono">${formatPrice(product.price * qty)}</div>
      </div>
    `).join("");

    document.getElementById("checkout-section").innerHTML = `
      <div class="eyebrow" style="margin-bottom:8px;">Stap 2 van 3</div>
      <h1>Afrekenen</h1>

      <div class="steps">
        <div class="step done"><span class="n">✓</span> Winkelwagen</div>
        <div class="step current"><span class="n">2</span> Gegevens &amp; betaling</div>
        <div class="step"><span class="n">3</span> Bevestiging</div>
      </div>

      <div class="demo-note">
        ⚠️ <div><strong>Demo-checkout.</strong> Dit is een demonstratie-webshop. Er wordt geen echte betaling verwerkt en er worden geen gegevens verzonden of opgeslagen buiten je browser.</div>
      </div>

      <form id="checkout-form" novalidate>
        <div class="checkout-layout">
          <div>
            <div class="form-section">
              <h3>Contactgegevens</h3>
              <div class="hint">Voor je orderbevestiging</div>
              <div class="form-row">
                <div class="field" data-field="email">
                  <label for="email">E-mailadres</label>
                  <input type="email" id="email" name="email">
                  <div class="field-error">Vul een geldig e-mailadres in</div>
                </div>
                <div class="field" data-field="phone">
                  <label for="phone">Telefoonnummer</label>
                  <input type="tel" id="phone" name="phone">
                  <div class="field-error">Vul een geldig telefoonnummer in</div>
                </div>
              </div>
            </div>

            <div class="form-section">
              <h3>Verzendadres</h3>
              <div class="hint">Waar mogen we je bestelling bezorgen?</div>
              <div class="form-row">
                <div class="field" data-field="firstName">
                  <label for="firstName">Voornaam</label>
                  <input type="text" id="firstName" name="firstName">
                  <div class="field-error">Verplicht veld</div>
                </div>
                <div class="field" data-field="lastName">
                  <label for="lastName">Achternaam</label>
                  <input type="text" id="lastName" name="lastName">
                  <div class="field-error">Verplicht veld</div>
                </div>
              </div>
              <div class="form-row single">
                <div class="field" data-field="address">
                  <label for="address">Straat en huisnummer</label>
                  <input type="text" id="address" name="address">
                  <div class="field-error">Verplicht veld</div>
                </div>
              </div>
              <div class="form-row">
                <div class="field" data-field="postcode">
                  <label for="postcode">Postcode</label>
                  <input type="text" id="postcode" name="postcode" placeholder="1234 AB">
                  <div class="field-error">Vul een geldige postcode in</div>
                </div>
                <div class="field" data-field="city">
                  <label for="city">Plaats</label>
                  <input type="text" id="city" name="city">
                  <div class="field-error">Verplicht veld</div>
                </div>
              </div>
              <div class="form-row single">
                <div class="field" data-field="country">
                  <label for="country">Land</label>
                  <select id="country" name="country">
                    <option value="NL">Nederland</option>
                    <option value="BE">België</option>
                    <option value="DE">Duitsland</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="form-section">
              <h3>Betaalmethode</h3>
              <div class="hint">Kies hoe je wilt betalen (demo — geen echte transactie)</div>
              <div class="pay-methods" id="pay-methods">
                <div class="pay-method selected" data-method="ideal">
                  <span class="pm-icon">🏦</span>iDEAL
                </div>
                <div class="pay-method" data-method="card">
                  <span class="pm-icon">💳</span>Creditcard
                </div>
                <div class="pay-method" data-method="paypal">
                  <span class="pm-icon">🅿️</span>PayPal
                </div>
              </div>

              <div id="card-fields">
                <div class="form-row">
                  <div class="field" data-field="cardNumber">
                    <label for="cardNumber">Kaartnummer</label>
                    <input type="text" id="cardNumber" name="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                    <div class="field-error">Vul een geldig kaartnummer in (demo)</div>
                  </div>
                  <div class="field" data-field="cardName">
                    <label for="cardName">Naam op kaart</label>
                    <input type="text" id="cardName" name="cardName">
                    <div class="field-error">Verplicht veld</div>
                  </div>
                </div>
                <div class="form-row">
                  <div class="field" data-field="cardExpiry">
                    <label for="cardExpiry">Vervaldatum</label>
                    <input type="text" id="cardExpiry" name="cardExpiry" placeholder="MM/JJ" maxlength="5">
                    <div class="field-error">Formaat MM/JJ</div>
                  </div>
                  <div class="field" data-field="cardCvc">
                    <label for="cardCvc">CVC</label>
                    <input type="text" id="cardCvc" name="cardCvc" placeholder="123" maxlength="4">
                    <div class="field-error">3 of 4 cijfers</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="order-summary-mini">
            <h3 style="margin-bottom:16px;">Jouw bestelling</h3>
            <div id="mini-items">${miniItems}</div>
            <div class="summary-row" style="margin-top:10px;">
              <span>Subtotaal</span>
              <span class="price">${formatPrice(totals.subtotal)}</span>
            </div>
            ${totals.promo ? `
            <div class="summary-row" style="color:var(--phosphor);">
              <span>Korting (${totals.promo.code})</span>
              <span>&minus; ${formatPrice(totals.discount)}</span>
            </div>` : ""}
            <div class="summary-row">
              <span>Verzending</span>
              <span>${totals.shipping === 0 ? "Gratis" : formatPrice(totals.shipping)}</span>
            </div>
            <div class="summary-row total">
              <span>Totaal</span>
              <span class="price">${formatPrice(totals.total)}</span>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:18px;" id="submit-btn">
              Bestelling plaatsen →
            </button>
            <a href="winkelwagen.html" class="btn btn-outline btn-block" style="margin-top:10px;">← Terug naar winkelwagen</a>
            <p style="font-size:11px; text-align:center; margin-top:14px; color:var(--paper-dim);">🔒 Demo-omgeving, geen echte betaalgegevens invoeren</p>
          </div>
        </div>
      </form>
    `;

    wireCheckoutForm();
  }

  function wireCheckoutForm(){
    const payMethods = document.getElementById("pay-methods");
    const cardFields = document.getElementById("card-fields");

    function updatePaymentUI(){
      const selected = payMethods.querySelector(".pay-method.selected").dataset.method;
      cardFields.style.display = selected === "card" ? "block" : "none";
    }
    payMethods.addEventListener("click", (e) => {
      const el = e.target.closest(".pay-method");
      if(!el) return;
      payMethods.querySelectorAll(".pay-method").forEach(m => m.classList.remove("selected"));
      el.classList.add("selected");
      updatePaymentUI();
    });
    updatePaymentUI();

    const form = document.getElementById("checkout-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if(validateForm()){
        submitOrder();
      }
    });
  }

  function setFieldError(name, hasError){
    const field = document.querySelector(`[data-field="${name}"]`);
    if(field) field.classList.toggle("error", hasError);
  }

  function validateForm(){
    let valid = true;
    const val = (id) => (document.getElementById(id)?.value || "").trim();

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("email"));
    setFieldError("email", !emailOk); if(!emailOk) valid = false;

    const phoneOk = val("phone").replace(/[\s-]/g, "").length >= 8;
    setFieldError("phone", !phoneOk); if(!phoneOk) valid = false;

    const firstNameOk = val("firstName").length > 0;
    setFieldError("firstName", !firstNameOk); if(!firstNameOk) valid = false;

    const lastNameOk = val("lastName").length > 0;
    setFieldError("lastName", !lastNameOk); if(!lastNameOk) valid = false;

    const addressOk = val("address").length > 3;
    setFieldError("address", !addressOk); if(!addressOk) valid = false;

    const postcodeOk = /^[0-9]{4}\s?[A-Za-z]{0,2}$/.test(val("postcode")) || val("postcode").length >= 4;
    setFieldError("postcode", !postcodeOk); if(!postcodeOk) valid = false;

    const cityOk = val("city").length > 0;
    setFieldError("city", !cityOk); if(!cityOk) valid = false;

    const selectedMethod = document.querySelector(".pay-method.selected")?.dataset.method;
    if(selectedMethod === "card"){
      const cardNumberOk = val("cardNumber").replace(/\s/g, "").length >= 12;
      setFieldError("cardNumber", !cardNumberOk); if(!cardNumberOk) valid = false;

      const cardNameOk = val("cardName").length > 0;
      setFieldError("cardName", !cardNameOk); if(!cardNameOk) valid = false;

      const cardExpiryOk = /^[0-9]{2}\/[0-9]{2}$/.test(val("cardExpiry"));
      setFieldError("cardExpiry", !cardExpiryOk); if(!cardExpiryOk) valid = false;

      const cardCvcOk = /^[0-9]{3,4}$/.test(val("cardCvc"));
      setFieldError("cardCvc", !cardCvcOk); if(!cardCvcOk) valid = false;
    }

    if(!valid){
      const firstError = document.querySelector(".field.error");
      if(firstError) firstError.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    return valid;
  }

  function submitOrder(){
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Bestelling verwerken...";

    const val = (id) => (document.getElementById(id)?.value || "").trim();
    const totals = computeTotals();
    const items = getCartItems();
    const method = document.querySelector(".pay-method.selected")?.dataset.method;

    const order = {
      orderNumber: "RV-" + Date.now().toString().slice(-8),
      date: new Date().toISOString(),
      customer: {
        firstName: val("firstName"),
        lastName: val("lastName"),
        email: val("email"),
        phone: val("phone"),
        address: val("address"),
        postcode: val("postcode"),
        city: val("city"),
        country: document.getElementById("country").value
      },
      paymentMethod: method,
      items: items.map(({product, qty}) => ({
        id: product.id, name: product.name, price: product.price, qty
      })),
      totals
    };

    // Simulate payment processing delay
    setTimeout(() => {
      sessionStorage.setItem("retrovault_last_order", JSON.stringify(order));
      clearCart();
      clearPromo();
      window.location.href = "bevestiging.html";
    }, 1400);
  }

  document.addEventListener("DOMContentLoaded", renderCheckout);
</script>
</body>
</html>
